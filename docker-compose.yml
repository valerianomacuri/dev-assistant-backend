services:
  db:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    container_name: devassistant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: devassistant
      POSTGRES_PASSWORD: devassistant
      POSTGRES_DB: devassistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devassistant -d devassistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
