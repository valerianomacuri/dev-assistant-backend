services:
  db:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    container_name: devassistant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: devassistant
      POSTGRES_PASSWORD: devassistant
      POSTGRES_DB: devassistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devassistant -d devassistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: devassistant-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Consola web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crea el bucket al arrancar y termina (idempotente).
  createbuckets:
    image: minio/mc:latest
    container_name: devassistant-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/dev-assistant;
      mc anonymous set none local/dev-assistant;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
